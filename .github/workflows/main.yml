name: Minecraft Server 24/7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install & Start ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
          ngrok tcp 25565 > /dev/null &

      - name: Download Minecraft Server Jar
        run: |
          mkdir server
          cd server
          wget -O server.jar "https://api.purpurmc.org/v2/purpur/1.20.4/latest/download"
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "spawn-protection=16" >> server.properties
          echo "motd=Welcome to Alex Server!" >> server.properties

      - name: Download Plugins (Geyser + Floodgate + EssentialsX)
        run: |
          cd server
          mkdir plugins
          cd plugins
          wget -O Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          wget -O Floodgate-Spigot.jar https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          wget -O EssentialsX.jar https://github.com/EssentialsX/Essentials/releases/download/2.20.1/EssentialsX-2.20.1.jar
          wget -O EssentialsXSpawn.jar https://github.com/EssentialsX/Essentials/releases/download/2.20.1/EssentialsXSpawn-2.20.1.jar

      - name: Print Server IP & Run Server
        run: |
          echo "Waiting for ngrok tunnel..."
          sleep 15
          NGROK_IP=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "=========================================="
          echo "YOUR MINECRAFT SERVER IP IS:"
          echo "$NGROK_IP"
          echo "=========================================="
          cd server
          java -Xmx6G -jar server.jar nogui
