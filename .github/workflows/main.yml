
name: Minecraft Server 24/7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ERROR: NGROK_TOKEN secret missing!"
            exit 1
          fi

          curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          nohup ngrok tcp 25565 \
            --log=stdout > ngrok.log 2>&1 &

          sleep 10

      - name: Download Minecraft Server
        run: |
          mkdir -p server
          cd server

          wget -O server.jar \
            "https://api.purpurmc.org/v2/purpur/1.20.4/latest/download"

          echo "eula=true" > eula.txt
          echo "online-mode=true" > server.properties
          echo "server-port=25565" >> server.properties
          echo "spawn-protection=16" >> server.properties
          echo "motd=Welcome to Alex Server!" >> server.properties

      - name: Install Plugins
        run: |
          mkdir -p server/plugins
          cd server/plugins

          wget -O Geyser-Spigot.jar \
            "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot"

          wget -O Floodgate-Spigot.jar \
            "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot"

          wget -O EssentialsX.jar \
            "https://github.com/EssentialsX/Essentials/releases/download/2.20.1/EssentialsX-2.20.1.jar"

          wget -O EssentialsXSpawn.jar \
            "https://github.com/EssentialsX/Essentials/releases/download/2.20.1/EssentialsXSpawn-2.20.1.jar"

      - name: Show Public Server Address
        run: |
          echo "Waiting for ngrok..."
          sleep 10

          echo "=================================="
          echo "ALEX MINECRAFT SERVER ADDRESS"
          echo "=================================="

          RESPONSE=$(curl -fsS \
            http://127.0.0.1:4040/api/tunnels || true)

          echo "$RESPONSE" | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
              tunnels = data.get("tunnels", [])
              for tunnel in tunnels:
                  url = tunnel.get("public_url", "")
                  if url.startswith("tcp://"):
                      print("JAVA SERVER ADDRESS:")
                      print(url.replace("tcp://", ""))
                      break
              else:
                  print("No TCP tunnel found.")
          except Exception:
              print("Unable to read ngrok address.")
          '

          echo "=================================="

          if [ -f ngrok.log ]; then
            tail -n 15 ngrok.log
          fi

      - name: Start Minecraft Server
        run: |
          cd server
          java -Xms1G -Xmx3G -jar server.jar nogui
